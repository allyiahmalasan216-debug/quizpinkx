<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
        content="width=device-width, initial-scale=1.0">
    <title>QuizZone 💗</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- ==============================
         HEADER
    =============================== -->
    <header class="header">
        <h1>💗 QuizPinkX</h1>
        <p>
            Test your knowledge!
        </p>
    </header>
    <!-- ==============================
         HOME
    =============================== -->
    <main id="home">
        <div class="home-card">
            <h2>
                Choose a Category
            </h2>
            <button
                onclick="startQuiz('it')">
                💻 IT & Technology
            </button>
            <button
                onclick="startQuiz('general')">
                🌎 General Knowledge
            </button>
            <button
                onclick="startQuiz('science')">
                🔬 Science
            </button>
            <button
                onclick="startQuiz('english')">
                📚 English
            </button>
        </div>
    </main>
    <!-- ==============================
         QUIZ
    =============================== -->
    <main id="quiz"
        class="hidden">
        <div class="quiz-card">
            <!-- TOP -->
            <div class="quiz-top">
                <button
                    class="back-btn"
                    onclick="backHome()">
                    ← Back
                </button>
                <div class="question-number">
                    Question
                    <span id="questionNumber">
                        1
                    </span>
                    /
                    <span id="totalQuestions">
                        10
                    </span>
                </div>
            </div>
            <!-- PROGRESS -->
            <div class="progress-container">
                <div
                    id="progressBar"
                    class="progress-bar">
                </div>
            </div>
            <!-- SCORE -->
            <div class="score">
                Score:
                <span id="score">
                    0
                </span>
            </div>
            <!-- QUESTION -->
            <div class="question-box">
                <h2 id="question">
                    Question goes here
                </h2>
            </div>
            <!-- ANSWERS -->
            <div
                id="answers"
                class="answers">
            </div>
            <!-- NEXT -->
            <button
                id="nextButton"
                class="next-btn"
                onclick="nextQuestion()"
                disabled>
                NEXT →
            </button>
        </div>
    </main>
    <!-- ==============================
         RESULT
    =============================== -->
    <main id="result"
        class="hidden">
        <div class="result-card">
            <h2>
                🎉 Quiz Complete!
            </h2>
            <div class="result-score">
                <span id="finalScore">
                    0
                </span>
                /
                <span id="finalTotal">
                    10
                </span>
            </div>
            <p id="resultMessage">
                Great job!
            </p>
            <button
                onclick="restartQuiz()">
                🔄 Play Again
            </button>
            <button
                onclick="backHome()">
                🏠 Back to Home
            </button>
        </div>
    </main>
    <!-- ==============================
         WINNER POPUP
    =============================== -->
    <div
        id="winnerPopup"
        class="popup hidden">
        <div class="popup-box">
            <div class="boom">
                💗
            </div>
            <h2 id="popupTitle">
                🎉 CORRECT!
            </h2>
            <p id="popupMessage">
                Nice job!
            </p>
            <button
                onclick="closePopup()">
                CONTINUE 💗
            </button>
        </div>
    </div>
    <!-- ==============================
         JAVASCRIPT
    =============================== -->
    <script src="script.js"></script>
</body>
</html>
